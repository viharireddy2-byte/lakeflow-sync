name: Deploy

on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  quality-gate:
    uses: ./.github/workflows/ci.yml

  deploy-qa:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality-gate
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Deploy bundle to QA
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_QA_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_QA_CLIENT_SECRET }}
        run: databricks bundle deploy -t qa

  deploy-prod:
    if: github.event_name == 'release'
    needs: quality-gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Deploy bundle to Production
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_PROD_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_PROD_CLIENT_SECRET }}
        run: databricks bundle deploy -t prod
