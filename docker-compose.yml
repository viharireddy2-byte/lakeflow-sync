# Local Postgres with logical replication enabled, for running the
# end-to-end CDC integration test (tests/integration/test_cdc_end_to_end.py)
# without touching a real Databricks workspace.
#
# Usage:
#   docker compose up -d
#   scripts/run_integration_tests.sh
#   docker compose down -v
#
# This does not run in the default `uv run pytest` / CI quality-gate --
# the integration test self-skips when LAKEFLOW_SYNC_PG_DSN is not set, so
# existing unit-test behavior and coverage gates are unaffected.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lakeflow_sync
      POSTGRES_PASSWORD: lakeflow_sync
      POSTGRES_DB: lakeflow_sync
    ports:
      - "55432:5432"
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakeflow_sync -d lakeflow_sync"]
      interval: 2s
      timeout: 3s
      retries: 20
