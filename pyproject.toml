[project]
name = "lakeflow-sync"
version = "0.1.0"
description = "Dual-mode (Full Load + CDC) ingestion pipeline from PostgreSQL to Databricks, built with dlt and orchestrated by Databricks Lakeflow Jobs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "lakeflow-sync maintainers" }]
dependencies = [
    "dlt[databricks]>=1.4.1",
    "psycopg2-binary>=2.9.9",
    "pyspark>=3.5.0",
    "databricks-sdk>=0.30.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
]
# Only needed to run tests/integration/ locally against docker-compose's
# Postgres (see scripts/run_integration_tests.sh) -- not required for the
# default `uv run pytest` quality gate, which skips those tests entirely
# when this extra isn't installed and LAKEFLOW_SYNC_PG_DSN isn't set.
integration = [
    "dlt[duckdb]>=1.4.1",
    "duckdb>=1.0.0",
]

[project.scripts]
pipeline_main = "lakeflow_sync.pipeline_main:main"
run_quality_checks = "lakeflow_sync.quality_checks:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lakeflow_sync"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/lakeflow_sync --cov-report=term-missing --cov-fail-under=70"
